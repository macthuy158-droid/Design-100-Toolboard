name: Structure Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile app.py app_v2.py admin_portal.py community_core.py community_portal.py community_admin.py main.py
      - name: Check route structure
        env:
          TOOLBOARD_ADMIN_PASSWORD: test-admin-password
          TOOLBOARD_SESSION_SECRET: test-session-secret
          TOOLBOARD_DATA_DIR: /tmp/design100-ci-data
        run: python scripts/check_structure.py
